
services:

  broker-py:
    build: ./python
    image: cc7261:python
    command: ["python", "broker.py"]
    volumes:
      - ./python/broker.py:/app/broker.py
      - ./python/protocolo.py:/app/protocolo.py

  proxy-py:
    build: ./python
    image: cc7261:python
    command: ["python", "proxy.py"]
    volumes:
      - ./python/proxy.py:/app/proxy.py

  referencia-py:
    build: ./python
    image: cc7261:python
    command: ["python", "referencia.py"]
    environment:
      NOME_REFERENCIA: referencia-py
      PORTA_REFERENCIA: "5560"
    volumes:
      - ./python/referencia.py:/app/referencia.py
      - ./python/protocolo.py:/app/protocolo.py

  servidor-py-1:
    build: ./python
    image: cc7261:python
    command: ["python", "servidor.py"]
    environment:
      NOME_SERVIDOR: servidor-py-1
      BROKER_ADDR: tcp://broker-py:5556
      PROXY_PUB: tcp://proxy-py:5557
      PROXY_SUB: tcp://proxy-py:5558
      REF_ADDR: tcp://referencia-py:5560
      PORTA_COORD: "5561"
      DATA_FILE: /data/dados.json
    volumes:
      - ./python/servidor.py:/app/servidor.py
      - ./python/protocolo.py:/app/protocolo.py
      - dados-py-1:/data
    depends_on: [broker-py, proxy-py, referencia-py]

  servidor-py-2:
    build: ./python
    image: cc7261:python
    command: ["python", "servidor.py"]
    environment:
      NOME_SERVIDOR: servidor-py-2
      BROKER_ADDR: tcp://broker-py:5556
      PROXY_PUB: tcp://proxy-py:5557
      PROXY_SUB: tcp://proxy-py:5558
      REF_ADDR: tcp://referencia-py:5560
      PORTA_COORD: "5561"
      DATA_FILE: /data/dados.json
    volumes:
      - ./python/servidor.py:/app/servidor.py
      - ./python/protocolo.py:/app/protocolo.py
      - dados-py-2:/data
    depends_on: [broker-py, proxy-py, referencia-py]

  bot-py-1:
    build: ./python
    image: cc7261:python
    command: ["python", "cliente.py"]
    environment:
      NOME_BOT: bot-py-1
      BROKER_ADDR: tcp://broker-py:5555
      PROXY_ADDR: tcp://proxy-py:5558
    volumes:
      - ./python/cliente.py:/app/cliente.py
      - ./python/protocolo.py:/app/protocolo.py
    depends_on: [servidor-py-1, servidor-py-2]

  bot-py-2:
    build: ./python
    image: cc7261:python
    command: ["python", "cliente.py"]
    environment:
      NOME_BOT: bot-py-2
      BROKER_ADDR: tcp://broker-py:5555
      PROXY_ADDR: tcp://proxy-py:5558
    volumes:
      - ./python/cliente.py:/app/cliente.py
      - ./python/protocolo.py:/app/protocolo.py
    depends_on: [servidor-py-1, servidor-py-2]

  broker-js:
    build: ./javascript
    image: cc7261:javascript
    command: ["node", "broker.js"]

  referencia-js:
    build: ./javascript
    image: cc7261:javascript
    command: ["node", "referencia.js"]
    environment:
      NOME_REFERENCIA: referencia-js
      PORTA_REFERENCIA: "5560"

  servidor-js-1:
    build: ./javascript
    image: cc7261:javascript
    command: ["node", "servidor.js"]
    environment:
      NOME_SERVIDOR: servidor-js-1
      BROKER_ADDR: tcp://broker-js:5556
      PROXY_PUB: tcp://proxy-py:5557
      PROXY_SUB: tcp://proxy-py:5558
      REF_ADDR: tcp://referencia-js:5560
      PORTA_COORD: "5561"
      DATA_FILE: /data/dados.json
    volumes:
      - dados-js-1:/data
    depends_on: [broker-js, proxy-py, referencia-js]

  servidor-js-2:
    build: ./javascript
    image: cc7261:javascript
    command: ["node", "servidor.js"]
    environment:
      NOME_SERVIDOR: servidor-js-2
      BROKER_ADDR: tcp://broker-js:5556
      PROXY_PUB: tcp://proxy-py:5557
      PROXY_SUB: tcp://proxy-py:5558
      REF_ADDR: tcp://referencia-js:5560
      PORTA_COORD: "5561"
      DATA_FILE: /data/dados.json
    volumes:
      - dados-js-2:/data
    depends_on: [broker-js, proxy-py, referencia-js]

  bot-js-1:
    build: ./javascript
    image: cc7261:javascript
    command: ["node", "cliente.js"]
    environment:
      NOME_BOT: bot-js-1
      BROKER_ADDR: tcp://broker-js:5555
      PROXY_ADDR: tcp://proxy-py:5558
    depends_on: [servidor-js-1, servidor-js-2]

  bot-js-2:
    build: ./javascript
    image: cc7261:javascript
    command: ["node", "cliente.js"]
    environment:
      NOME_BOT: bot-js-2
      BROKER_ADDR: tcp://broker-js:5555
      PROXY_ADDR: tcp://proxy-py:5558
    depends_on: [servidor-js-1, servidor-js-2]

volumes:
  dados-py-1:
  dados-py-2:
  dados-js-1:
  dados-js-2: